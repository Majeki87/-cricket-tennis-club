<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#176b42"><title>귀뚜라미 테니스 클럽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:#17251d;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.sub{font-size:12px;color:#627267;font-weight:700;letter-spacing:1px}.title{font-size:25px;font-weight:900}.panel{background:white;border:1px solid #dce5dc;border-radius:15px;padding:13px;margin-top:12px;box-shadow:0 2px 8px #183b1810}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.score{font-size:30px;font-weight:900;text-align:center}.score small{display:block;font-size:12px;color:#637269}.arena{position:relative;background:#247b49;border:5px solid white;border-radius:13px;overflow:hidden;aspect-ratio:4/3;margin-top:12px;touch-action:none;box-shadow:0 4px 12px #123c2520}.lines{position:absolute;inset:5% 8%;border:2px solid #ffffffb8}.mid{position:absolute;left:50%;top:5%;height:90%;border-left:2px solid #ffffffb8}.hmid{position:absolute;left:8%;right:8%;top:50%;border-top:2px solid #ffffffb8}.net{position:absolute;left:50%;top:5%;height:90%;border-left:4px dashed #ffffff88}.bug{position:absolute;z-index:3;transform:translate(-50%,-50%);width:clamp(54px,11vw,78px);height:clamp(54px,11vw,78px);filter:drop-shadow(0 4px 3px #153a2566);user-select:none;pointer-events:none;animation:idleBob 1.5s ease-in-out infinite}.bug svg{width:100%;height:100%;overflow:visible}.bug.opponent{transform:translate(-50%,-50%) rotate(180deg);filter:drop-shadow(0 4px 3px #153a2566) hue-rotate(115deg)}.bug.swinging{animation:cricketSwing .34s ease-in-out}.bug .racket{transform-origin:78px 48px;transition:transform .12s ease}.bug.swinging .racket{transform:rotate(-72deg)}@keyframes idleBob{0%,100%{margin-top:0}50%{margin-top:-4px}}@keyframes cricketSwing{0%{transform:translate(-50%,-50%) rotate(0) scale(1)}35%{transform:translate(-50%,-50%) rotate(-15deg) scale(1.12)}100%{transform:translate(-50%,-50%) rotate(0) scale(1)}}.ball{position:absolute;z-index:4;width:13px;height:13px;border-radius:50%;background:#edff45;border:2px solid white;transform:translate(-50%,-50%);box-shadow:0 0 10px #edff45}.overlay{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:white;font-weight:900;font-size:19px;background:#102d2080;padding:20px}.overlay span{font-size:13px;font-weight:500}.btn{border:0;border-radius:10px;padding:12px 14px;background:#176b42;color:white;font-weight:800;font-size:15px;cursor:pointer}.btn.alt{background:#e7f0e8;color:#195c39}.btn:disabled{opacity:.45}.field{min-width:0;width:100%;padding:11px;border:1px solid #ccd8ce;border-radius:9px;font-size:15px}.muted{font-size:12px;color:#68766c}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:250px;margin:auto}.pad button{font-size:20px;min-height:46px;background:#edf4ee;color:#175c38;border:1px solid #d7e3d9;border-radius:10px;touch-action:none}.pad .blank{visibility:hidden}.status{font-size:13px;text-align:center;background:#f0f5f0;padding:10px;border-radius:9px;margin-top:10px}.hidden{display:none!important}
</style></head><body><main class="wrap">
<header class="top"><div><div class="sub">KRE TENNIS CLUB · 2026</div><div class="title">🦗 귀뚜라미 테니스</div></div><div style="font-size:12px;text-align:right;color:#657267">CRICKET<br>CHAMPIONSHIP</div></header>
<section class="panel"><b>게임 모드</b><div class="row" style="margin-top:9px"><button id="soloTab" class="btn">개인 연습</button><button id="multiTab" class="btn alt">실시간 대전</button></div>
<div id="soloSetup" style="margin-top:12px"><div class="muted">혼자 컴퓨터 상대와 경기합니다. 먼저 5점을 얻으면 승리!</div><button id="soloStart" class="btn" style="width:100%;margin-top:9px">개인전 시작</button></div>
<div id="multiSetup" class="hidden" style="margin-top:12px"><label class="muted">내 닉네임</label><input id="name" class="field" maxlength="12" value="귀뚜라미 선수"><div class="row" style="margin-top:8px"><button id="createRoom" class="btn">방 만들기</button><input id="roomCode" class="field" placeholder="방 코드"><button id="joinRoom" class="btn alt">참가</button></div><div class="muted" style="margin-top:7px">방을 만든 사람이 방 코드를 상대에게 공유하세요. 2명까지 입장할 수 있습니다.</div></div></section>
<section class="row" style="margin-top:12px"><div class="panel" style="margin:0"><div class="score" id="myScore">0</div><div class="muted" style="text-align:center">내 점수</div></div><div class="panel" style="margin:0"><div class="score" id="oppScore">0</div><div class="muted" style="text-align:center" id="oppLabel">컴퓨터</div></div></section>
<div class="arena" id="arena"><div class="lines"></div><div class="mid"></div><div class="hmid"></div><div class="net"></div><div class="bug opponent" id="opponent" role="img" aria-label="상대 귀뚜라미 선수"><svg viewBox="0 0 120 100" aria-hidden="true"><g stroke="#173c2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 34 Q22 2 15 17 M58 31 Q48 0 60 8" fill="none"/><path d="M42 66 L18 87 M54 70 L42 96 M72 66 L94 88 M78 57 L108 70" fill="none"/><path d="M36 48 Q18 42 16 57 M78 45 Q96 36 101 48" fill="none"/></g><ellipse cx="59" cy="60" rx="29" ry="21" fill="#42a86b" stroke="#173c2b" stroke-width="4"/><ellipse cx="48" cy="61" rx="12" ry="16" fill="#8bdc85"/><circle cx="42" cy="34" r="19" fill="#62c878" stroke="#173c2b" stroke-width="4"/><circle cx="35" cy="31" r="5" fill="white"/><circle cx="36" cy="31" r="2.5" fill="#142a20"/><path d="M26 43 Q42 52 55 43" fill="none" stroke="#173c2b" stroke-width="3" stroke-linecap="round"/><g class="racket"><path d="M79 42 L95 18" stroke="#f5d58b" stroke-width="5" stroke-linecap="round"/><ellipse cx="101" cy="12" rx="10" ry="15" transform="rotate(35 101 12)" fill="none" stroke="#f5f1dd" stroke-width="4"/><path d="M94 3 L108 20 M91 10 L104 1 M98 24 L110 9" stroke="#f5f1dd" stroke-width="1.5"/></g><path d="M19 86 L10 91 M42 95 L34 99 M95 87 L104 92 M108 70 L115 70" stroke="#173c2b" stroke-width="4" stroke-linecap="round"/></svg></div><div class="bug" id="player" role="img" aria-label="내 귀뚜라미 선수"><svg viewBox="0 0 120 100" aria-hidden="true"><g stroke="#173c2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M48 34 Q22 2 15 17 M58 31 Q48 0 60 8" fill="none"/><path d="M42 66 L18 87 M54 70 L42 96 M72 66 L94 88 M78 57 L108 70" fill="none"/><path d="M36 48 Q18 42 16 57 M78 45 Q96 36 101 48" fill="none"/></g><ellipse cx="59" cy="60" rx="29" ry="21" fill="#42a86b" stroke="#173c2b" stroke-width="4"/><ellipse cx="48" cy="61" rx="12" ry="16" fill="#8bdc85"/><circle cx="42" cy="34" r="19" fill="#62c878" stroke="#173c2b" stroke-width="4"/><circle cx="35" cy="31" r="5" fill="white"/><circle cx="36" cy="31" r="2.5" fill="#142a20"/><path d="M26 43 Q42 52 55 43" fill="none" stroke="#173c2b" stroke-width="3" stroke-linecap="round"/><g class="racket"><path d="M79 42 L95 18" stroke="#f5d58b" stroke-width="5" stroke-linecap="round"/><ellipse cx="101" cy="12" rx="10" ry="15" transform="rotate(35 101 12)" fill="none" stroke="#f5f1dd" stroke-width="4"/><path d="M94 3 L108 20 M91 10 L104 1 M98 24 L110 9" stroke="#f5f1dd" stroke-width="1.5"/></g><path d="M19 86 L10 91 M42 95 L34 99 M95 87 L104 92 M108 70 L115 70" stroke="#173c2b" stroke-width="4" stroke-linecap="round"/></svg></div><div class="ball" id="ball"></div><div class="overlay" id="overlay">🎾<br>귀뚜라미 테니스<br><span>게임 모드를 선택하고 시작하세요</span></div></div>
<div class="panel"><div class="row"><b id="gameStatus">대기 중</b><span class="muted" id="roomInfo" style="text-align:right">개인 연습 모드</span></div><div class="status" id="message">방향키로 이동하고 스페이스바로 공을 쳐보세요.</div><div class="row" style="margin-top:10px"><button id="startPoint" class="btn" disabled>다음 포인트 / 시작</button><button id="reset" class="btn alt">초기화</button></div></div>
<section class="panel"><b>🎮 조작</b><div class="muted" style="margin:5px 0 10px">키보드: 방향키 또는 WASD · 스페이스바: 스윙</div><div class="pad"><button class="blank">·</button><button data-key="up">⬆️</button><button class="blank">·</button><button data-key="left">⬅️</button><button data-key="down">⬇️</button><button data-key="right">➡️</button></div><button id="hit" class="btn" style="width:100%;margin-top:9px">🎾 공 치기</button></section>
<footer class="muted" style="text-align:center;padding:14px">귀뚜라미 테니스 클럽 · 사내 친선 게임</footer>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let mode="solo",running=false,finished=false,score=[0,0],p=[{x:50,y:79},{x:50,y:21}],ball={x:50,y:50,vx:0,vy:0,active:false,hit:0},keys={},swing=false,raf=0,last=0,ws=null,side=0,room="",serverState=null;
function draw(){
 $("player").style.left=p[side].x+"%";$("player").style.top=p[side].y+"%";
 $("opponent").style.left=p[1-side].x+"%";$("opponent").style.top=p[1-side].y+"%";
 $("ball").style.left=ball.x+"%";$("ball").style.top=ball.y+"%";$("ball").style.display=ball.active?"block":"none";
 $("myScore").textContent=score[side];$("oppScore").textContent=score[1-side];
}
function msg(t){$("message").textContent=t}
function animateSwing(id){const el=$(id);el.classList.remove("swinging");void el.offsetWidth;el.classList.add("swinging");setTimeout(()=>el.classList.remove("swinging"),360)}
function overlay(a,b){$("overlay").classList.remove("hidden");$("overlay").innerHTML=a+"<br><span>"+b+"</span>"}
function hide(){ $("overlay").classList.add("hidden")}
function setMode(m){mode=m;if(m==="solo")side=0;$("soloTab").className="btn "+(m==="solo"?"":"alt");$("multiTab").className="btn "+(m==="multi"?"":"alt");$("soloSetup").classList.toggle("hidden",m!=="solo");$("multiSetup").classList.toggle("hidden",m!=="multi");$("oppLabel").textContent=m==="solo"?"컴퓨터":"상대 선수";$("roomInfo").textContent=m==="solo"?"개인 연습 모드":"온라인 대전"}
function pointServe(){ball={x:50,y:side===0?25:75,vx:(Math.random()-.5)*.3,vy:side===0?.55:-.55,active:true,hit:0};running=true;hide();$("gameStatus").textContent="경기 중";msg("서브! 공을 받아쳐 보세요.");}
function reset(){cancelAnimationFrame(raf);running=false;finished=false;score=[0,0];p=[{x:50,y:79},{x:50,y:21}];ball.active=false;draw();$("gameStatus").textContent="대기 중";$("startPoint").disabled=mode==="multi";$("startPoint").textContent="다음 포인트 / 시작";overlay("🦗 귀뚜라미 테니스","게임을 시작하세요!")}
function soloStart(){if(mode!=="solo")return;reset();pointServe();last=performance.now();raf=requestAnimationFrame(soloLoop)}
function soloLoop(t){if(!running||mode!=="solo")return;const dt=Math.min((t-last)/16.67,2);last=t;movePlayer(0,dt);
 // simple computer tracking and return
 if(ball.active){p[1].x+=clamp(ball.x-p[1].x,-.45*dt,.45*dt);p[1].y+=clamp(ball.y-p[1].y,-.3*dt,.3*dt);
 if(Math.hypot(p[1].x-ball.x,p[1].y-ball.y)<9&&ball.hit===1){animateSwing("opponent");ball.hit=0;ball.vx=clamp((p[0].x-p[1].x)*.025+(Math.random()-.5)*.22,-.7,.7);ball.vy=.75;msg("컴퓨터가 공을 받아쳤습니다!");}
 advanceBall(dt);
 }draw();if(running)raf=requestAnimationFrame(soloLoop)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function movePlayer(i,dt){let k=i===side?keys:{},dx=(k.right?1:0)-(k.left?1:0),dy=(k.down?1:0)-(k.up?1:0),mag=Math.hypot(dx,dy)||1;p[i].x=clamp(p[i].x+dx/mag*.85*dt,10,90);p[i].y=i===0?clamp(p[i].y+dy/mag*.85*dt,53,91):clamp(p[i].y+dy/mag*.85*dt,9,47)}
function advanceBall(){if(!ball.active)return;ball.x+=ball.vx;ball.y+=ball.vy;ball.vy+=ball.vy>0?.003:-.003;if(ball.x<8||ball.x>92){ball.vx*=-.88;ball.x=clamp(ball.x,8,92)}
 if(ball.y<4){award(0);return}if(ball.y>96){award(1);return}
 const receiver=ball.y<50?1:0;if(Math.hypot(p[receiver].x-ball.x,p[receiver].y-ball.y)<9&&ball.hit===receiver){ball.hit=1-receiver;ball.vx=clamp((ball.x-p[receiver].x)*.035+(Math.random()-.5)*.2,-.7,.7);ball.vy=receiver===0?-.76:.76}}
function award(w){running=false;ball.active=false;score[w]++;draw();if(score[w]>=5){finished=true;$("gameStatus").textContent="경기 종료";overlay(w===side?"🏆 우승!":"😵 패배!",score[side]+" : "+score[1-side]+" · 다시 도전하세요");$("startPoint").disabled=false;msg(w===side?"축하합니다! 챔피언입니다.":"아쉽습니다. 다시 도전해 보세요.");}else{$("gameStatus").textContent="포인트 종료";$("startPoint").disabled=false;msg((w===side?"내가":"컴퓨터가")+" 득점했습니다.");}}
function hitBall(){if(mode==="multi"){animateSwing("player");if(ws?.readyState===1)sendInput(true);return}if(!running||!ball.active)return;if(Math.hypot(p[0].x-ball.x,p[0].y-ball.y)<18&&ball.hit===0){animateSwing("player");ball.hit=1;ball.vx=clamp((ball.x-p[0].x)*.035+(Math.random()-.5)*.2,-.7,.7);ball.vy=-.78;msg("강력한 리턴! 상대 코트로 날아갑니다!")}else msg("헛스윙! 공이 가까이 왔을 때 쳐보세요.")}
function sendInput(hit=false){if(ws?.readyState!==1)return;ws.send(JSON.stringify({type:"input",keys,hit}))}
function connect(create){if(ws)ws.close();const proto=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(proto+"://"+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:"join",room:create?"":$("roomCode").value,name:$("name").value||"귀뚜라미"}));ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==="error"){msg(d.message);return}if(d.type==="joined"){room=d.room;side=d.side;$("roomCode").value=room;$("roomInfo").textContent="방 코드: "+room+" · "+(side===0?"호스트":"참가자");msg("방에 입장했습니다. 상대에게 방 코드를 공유하세요.");return}if(d.type==="state"){serverState=d;score=d.score;p=d.players;ball=d.ball;$("gameStatus").textContent=d.status==="playing"?"경기 중":d.status==="finished"?"경기 종료":d.status==="ready"?"선수 준비 완료":"대기 중";$("startPoint").disabled=!(side===0&&d.status!=="playing"&&d.status!=="waiting");$("startPoint").textContent=d.status==="finished"?"새 경기":"경기 시작";$("oppLabel").textContent=d.names?.[1-side]||"상대 선수";msg(d.message);if(d.status==="finished")overlay(d.winner===side?"🏆 우승!":"경기 종료",score[side]+" : "+score[1-side]);else if(d.status==="playing")hide();draw()}};ws.onclose=()=>{if(mode==="multi")msg("서버 연결이 끊어졌습니다. 다시 접속해 주세요.")}}
$("soloTab").onclick=()=>{if(ws)ws.close();setMode("solo");reset()};$("multiTab").onclick=()=>{setMode("multi");reset()};
$("soloStart").onclick=soloStart;$("createRoom").onclick=()=>{setMode("multi");connect(true)};$("joinRoom").onclick=()=>{if(!$("roomCode").value.trim()){msg("방 코드를 입력하세요.");return}connect(false)};
$("startPoint").onclick=()=>{if(mode==="multi"){if(ws?.readyState===1)ws.send(JSON.stringify({type:"start"}))}else if(finished){soloStart()}else if(!running){pointServe();last=performance.now();raf=requestAnimationFrame(soloLoop)}};
$("reset").onclick=()=>{if(mode==="solo")reset();else if(ws)ws.close();setMode("multi");reset()};$("hit").onclick=hitBall;
document.querySelectorAll("[data-key]").forEach(b=>{let k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;sendInput()});["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false;sendInput()}))});
window.addEventListener("keydown",e=>{let k={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"}[e.key];if(k){keys[k]=true;sendInput();e.preventDefault()}if(e.code==="Space"){e.preventDefault();hitBall()}});
window.addEventListener("keyup",e=>{let k={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"}[e.key];if(k){keys[k]=false;sendInput()}});
setMode("solo");reset();
})();
</script></body></html>
